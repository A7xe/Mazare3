# Mazare3 Jordan — reverse proxy to Docker (localhost only)
# web: 127.0.0.1:3200  api: 127.0.0.1:4200

upstream mazare3_web {
    server 127.0.0.1:3200;
    keepalive 32;
}

upstream mazare3_api {
    server 127.0.0.1:4200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mazare3-jo.com www.mazare3-jo.com;

    client_max_body_size 25M;

    # Express API (do not send /api/paytabs or /api/payment-return here)
    location /api/v1 {
        proxy_pass http://mazare3_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://mazare3_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://mazare3_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 120s;
    }
}
