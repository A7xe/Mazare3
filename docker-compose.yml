name: mazare3

# Host ports (localhost only — public traffic goes through existing nginx):
#   web 127.0.0.1:3200  → container 3000
#   api 127.0.0.1:4200  → container 4000
# Avoids 80/443 (host nginx), 3000/4000 (Jeeran), 3100/4100 (Gigzhouse), 8080/4400 (LMS).

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:4200:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - mazare3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://mazare3-jo.com/api/v1
        NEXT_PUBLIC_APP_URL: https://mazare3-jo.com
        CLOUDFLARE_R2_MEDIA_PUBLIC_URL: ${CLOUDFLARE_R2_MEDIA_PUBLIC_URL:-}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: https://mazare3-jo.com/api/v1
      NEXT_PUBLIC_APP_URL: https://mazare3-jo.com
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - mazare3

networks:
  mazare3:
    driver: bridge
